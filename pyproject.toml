[project]
name = "noc-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhinav", email = "saiabhinav190404@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb==0.5.15",
    "fastapi==0.115.4",
    "google-genai==1.2.0",
    "groq==0.13.0",
    "pydantic==2.9.2",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "rank-bm25==0.2.2",
    "requests==2.32.3",
    "sentence-transformers==3.2.1",
    "streamlit==1.39.0",
    "uvicorn==0.32.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
