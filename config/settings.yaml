embedding_model: "BAAI/bge-small-en-v1.5"
gemini_model: "gemini-3.7-flash"   # chosen by measuring verbatim-quote adherence;
                                   # gemini-2.5-flash spliced two bullets into one quote.
groq_model: "openai/gpt-oss-120b"  # only Groq family accepting strict json_schema;
                                   # blocked at runtime by an 8,000 TPM free-tier cap.
top_k: 8
max_chunk_chars: 6000
per_spec_cap: 4         # max ranked chunks from one spec
sibling_expand_from: 1  # expand siblings of this many top-ranked hits
sibling_cap: 4          # max sibling chunks appended after ranking
cosine_threshold: 0.79  # fitted on the frozen eval set (scripts/calibrate.py):
                        # answerable cosine 0.648-0.891, out-of-scope 0.561-0.791.
bm25_threshold: 19.5    # fitted alongside: answerable bm25 16.65-59.94,
                        # out-of-scope 12.61-30.12. Gate 1 is a coarse AND filter.
session_cap: 20
daily_cap: 500
