    question: "Does the fault supervision specification define how a consumer detects that alarms have been lost?"
    gold: ["28.545#7"]

  - id: q029
    kind: noc
    expect: answer
    question: "How are VNF application alarms correlated with alarms related to virtualised resources?"
    gold: ["28.545#8"]

  - id: q030
    kind: noc
    expect: answer
    question: "What are the steps for an authorised consumer to retrieve the alarm list of a network function instance?"
    gold: ["28.545#5.1.16"]

  # ---- paraphrase: operator vocabulary, not the specification's ----------

  - id: q031
    kind: paraphrase
    expect: answer
    question: "Handsets on one cell keep dropping back to idle a few seconds after the radio gets bad. Which timer and counter chain produces that behaviour?"
    gold: ["38.331#5.3.10.1", "38.331#5.3.10.3"]

  - id: q032
    kind: paraphrase
    expect: answer
    question: "Why would a call ride through a brief signal dip without any signalling being exchanged?"
    gold: ["38.331#5.3.10.2"]

  - id: q033
    kind: paraphrase
    expect: answer
    question: "A phone has uplink data waiting but no grant. What does it send to tell the network how much data is queued?"
    gold: ["38.321#5.4.5"]

  - id: q034
    kind: paraphrase
    expect: answer
    question: "After a handover goes wrong the phone reappears on the old cell. Which counter picks that up, and how does it know?"
    gold: ["28.552#5.1.1.6.1.9"]

  - id: q035
    kind: paraphrase
    expect: answer
    question: "Packets keep arriving out of order and the stack seems to sit on them for a while before passing them up. What governs that wait?"
    gold: ["38.323#5.2.2.2"]

  # ---- refusals: nothing in the corpus covers it -------------------------

  - id: r001
    expect: refuse
    reason: no_relevant_clause
    question: "What is the peak throughput of Wi-Fi 7?"

  - id: r002
    expect: refuse
    reason: no_relevant_clause
    question: "How does the AMF handle initial UE registration?"

  - id: r003
    expect: refuse
    reason: no_relevant_clause
    # ASN.1 information elements are excluded from the corpus (ADR 0005). This
    # question proves the exclusion produces a refusal rather than a guess.
    question: "What fields does the RRCReconfiguration message contain?"

  - id: r004
    expect: refuse
    reason: no_relevant_clause
    question: "What are the NR channel bandwidths and PRB counts defined for FR1?"

  - id: r005
    expect: refuse
    reason: no_relevant_clause
    question: "How is the mapping from 5QI to DSCP markings configured on the transport network?"

  - id: r006
    expect: refuse
    reason: no_relevant_clause
    question: "Which information elements does the F1AP UE CONTEXT SETUP REQUEST carry?"

  - id: r007
    expect: refuse
    reason: no_relevant_clause
    question: "What is the maximum transmit power of a class 3 NR user equipment?"

  # ---- refusals: on-topic, but the corpus lacks the specific fact --------

  - id: r008
    expect: refuse
    reason: insufficient
    # The re-establishment procedure clauses are on-topic and will retrieve;
    # the message definition itself is ASN.1 and excluded (ADR 0005).
    question: "What is the ASN.1 definition of the RRCReestablishmentRequest message?"

  - id: r010
    expect: refuse
    reason: insufficient
    question: "How many milliseconds long is T310?"

  # ---- refusals: about a live network, which no specification can answer --

  - id: r011
    expect: refuse
    reason: not_answerable_from_standards
    question: "Why is cell 4412 dropping calls tonight?"

  - id: r012
    expect: refuse
    reason: not_answerable_from_standards
    question: "Our RRC setup success rate fell to 82% this morning. What caused it?"

  - id: r013
    expect: refuse
    reason: not_answerable_from_standards
    question: "Which of my sites needs a PRB capacity upgrade most urgently?"

  - id: r014
    expect: refuse
    reason: not_answerable_from_standards
    question: "Should I raise maxRetxThreshold on this cell to stop the drops we are seeing?"

  - id: r015
    expect: refuse
    reason: not_answerable_from_standards
    question: "How many UEs are connected to gNB 12 right now?"
